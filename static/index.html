<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsAI</title><style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1b1b1f;--mu:#6b6b76;--ac:#4f46e5;--bd:#e4e4e7}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c20;--tx:#ececf1;--mu:#9a9aa6;--ac:#818cf8;--bd:#2c2c33}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:20px;margin:0 auto 0 0}h1 span{color:var(--ac)}main{max-width:820px;margin:auto;padding:20px}
button,input{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card h3{margin:4px 0}.card a{color:inherit;text-decoration:none}.meta{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}h2{margin:24px 0 0;font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
</style></head><body>
<header><h1>News<span>AI</span></h1><button id="t-digest" class="on">My Digest</button><button id="t-explore">Explore</button><button id="t-prefs">Interests</button><button id="refresh">↻ Fetch news</button></header>
<main id="m"></main>
<script>
const CATS=["Technology","Business","Politics","Sports","Science","Health","World","Entertainment"];
let uid=+localStorage.uid||null;const $=s=>document.querySelector(s),m=$("#m");
const api=(u,b)=>fetch(u,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const h=(Date.now()/1e3-t)/3600;return h<1?"just now":h<24?Math.floor(h)+"h ago":Math.floor(h/24)+"d ago"};
function tab(n){["digest","explore","prefs"].forEach(x=>$("#t-"+x).classList.toggle("on",x==n));({digest,explore,prefs})[n]()}
const art=(a,fb)=>`<div class="card"><span class="tag">${esc(a.category)}</span> <span class="meta">${esc(a.source)} · ${ago(a.published)}</span>
<h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3><p>${esc(a.summary)}</p>
${a.also_covered_by?.length?`<div class="meta">Also covered by: ${a.also_covered_by.map(esc).join(", ")}</div>`:""}
${fb&&uid?`<button onclick="fbk(${a.id},1,this)">👍 More like this</button> <button onclick="fbk(${a.id},0,this)">👎 Less</button>`:""}</div>`;
async function fbk(id,l,b){await api("/api/feedback",{user_id:uid,article_id:id,liked:!!l});b.textContent="Saved ✓"}
async function digest(){if(!uid)return prefs();m.innerHTML="Loading…";const d=await api("/api/digest/"+uid);
 m.innerHTML=`<h2>${d.date} · ${d.total} stories</h2>`+(d.total?Object.entries(d.sections).map(([c,a])=>`<h2>${c}</h2>`+a.map(x=>art(x,1)).join("")).join(""):`<div class="card">No articles yet — click “Fetch news”.</div>`)}
async function explore(){m.innerHTML=`<input id="q" placeholder="Search…" style="width:100%"><div class="chips">${["All",...CATS].map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div><div id="r"></div>`;
 let cat="",q="";const go=async()=>{$("#r").innerHTML=(await api(`/api/articles?category=${cat}&q=${encodeURIComponent(q)}`)).map(a=>art(a)).join("")||"No results."};
 $("#q").oninput=e=>{q=e.target.value;go()};m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c=="All"?"":b.dataset.c;go()});go()}
async function prefs(){const u=uid?await api("/api/user/"+uid):{prefs:{weights:{},keywords:[]}};
 m.innerHTML=`<div class="card"><h3>Your profile</h3><input id="nm" placeholder="Name" value="${esc(u.name||"")}"> <input id="em" placeholder="Email (for digests)" value="${esc(u.email||"")}">
 <h3>Interests</h3><div class="chips">${CATS.map(c=>`<button class="${c in u.prefs.weights?"on":""}" onclick="this.classList.toggle('on')">${c}</button>`).join("")}</div>
 <input id="kw" style="width:100%" placeholder="Keywords, comma separated (e.g. openai, f1, startups)" value="${esc(u.prefs.keywords.join(", "))}"><br><br><button class="p" id="sv">Save & build my digest</button></div>`;
 $("#sv").onclick=async()=>{const r=await api("/api/user",{id:uid,name:$("#nm").value||"Reader",email:$("#em").value,categories:[...m.querySelectorAll(".chips .on")].map(b=>b.textContent),keywords:$("#kw").value.split(",").map(s=>s.trim()).filter(Boolean)});
  uid=r.id;localStorage.uid=uid;tab("digest")}}
$("#t-digest").onclick=()=>tab("digest");$("#t-explore").onclick=()=>tab("explore");$("#t-prefs").onclick=()=>tab("prefs");
$("#refresh").onclick=async e=>{e.target.textContent="Fetching…";const r=await api("/api/refresh",{});e.target.textContent=`+${r.added} new ↻`;tab("digest")};
tab("digest");
</script></body></html>
